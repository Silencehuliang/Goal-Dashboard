# Goal-Dashboard 的 bundle 层：以裸包名插入 profile 树（dsh plugin add 时自动激活）。
# 单包双半：一条 insert 同时承载两个半边——
#   host 半边：graph_* 工具 + skill 注册 + /api/dsh-graph* 端点（本包 index.js）；
#   client 半边：浏览器看板（lib/client.js，经 package.json 的 dsh.client + exports["./client"]
#                 由 client-modules 编入 __DSH_BOOT__，渲染进 conversation.view 槽）。
# name 用 npm 包名 goal-dashboard（裸包名 → client-modules 按 <name>/package.json 解析 dsh.client，
# bundle URL 为 /plugins/goal-dashboard/client.js；客户端 bundle 的
# window.__ModuleLoader__.load({ id }) 必须与包名逐字一致，见 lib/client/_wrapper-top.js）。
# id 保留内部插件名 dsh-graph-host（用户层 patch 按 id 覆盖 config；改名会破坏既有用户 patch）。
# root 相对 workspace 根（process.cwd()），统一解析 resolve(workspaceRoot, config.root ?? ".dsh-graph")。
- insert:
    - id: dsh-graph-host
      name: goal-dashboard
      config:
        root: .dsh-graph
