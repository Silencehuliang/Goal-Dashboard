# Goal-Dashboard 开发期 workspace。
#
# 与上游 dsh-graph 的差异：这里**不再**把 dsh-graph-host 纳入 workspace。
# 原因：Goal-Dashboard 的仓库根 package.json 本身即插件清单（name=goal-dashboard，
# main=dist/index.js），而 dsh-graph-host/package.json 也必须叫 goal-dashboard
# 才能让 scripts/build.sh 生成同名 dist/package.json —— 同名包同时出现在
# workspace packages 里会让 pnpm 报重复包名。
#
# 上游把 dsh-graph-host 纳入 workspace 是为了 profile 以 `link:` 安装时让
# @deepseek-ai/schemastery 能从仓库根 node_modules 解析。Goal-Dashboard 改为
# 按正常包安装（profile 自行解析 peer），不再依赖该技巧。
#
# nodeLinker/autoInstallPeers 保持与上游一致。
packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
